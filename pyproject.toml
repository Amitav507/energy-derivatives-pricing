[project]
name = "energy-derivatives-pricing"
version = "0.1.0"
description = "Black-76 and Black-Scholes pricing for energy and commodity derivatives, with Greeks, implied volatility and Monte Carlo"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
data = [
    "pandas>=2.0",
    "yfinance>=0.2",
    "requests>=2.28",
]
entsoe = ["entsoe-py>=0.6"]
figures = ["matplotlib>=3.7"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["engine*", "marketdata*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
